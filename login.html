<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Gale Tarot</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginBtn = document.getElementById("login-btn");
            const userIn = document.getElementById("username");
            const passIn = document.getElementById("password");
            const err = document.getElementById("login-error");

            loginBtn.addEventListener("click", (e) => {
                e.preventDefault();
                if (userIn.value === "admin" && passIn.value === "gale123") {
                    sessionStorage.setItem("admin_auth", "true");
                    window.location.href = "cards.html";
                } else {
                    err.style.display = "block";
                }
            });
        });
    </script>
</head>

<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="login.html" class="active">Admin Login</a>
    </nav>

    <main>
        <div class="login-container fade-in">
            <h1>Tarot Reader Login</h1>
            <p class="subtitle">Enter the secret portal</p>

            <form class="login-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="login-input" placeholder="e.g. admin">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="login-input" placeholder="Enter password">
                </div>
                <button type="submit" id="login-btn" class="login-btn">Unlock Deck</button>
                <div id="login-error">Incorrect username or password.</div>
            </form>
        </div>
    </main>
</body>

</html>
